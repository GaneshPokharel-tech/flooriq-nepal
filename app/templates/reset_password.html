<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>FloorIQ — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080c10;--card:#0f1923;--border:#1c2430;--green:#00d084;--red:#ff4d4d;--text:#e2e8f0;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{width:100%;max-width:400px;padding:0 20px;}
.icon{width:48px;height:48px;background:#00d08420;border:1.5px solid #00d08440;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:20px;}
h1{font-size:22px;font-weight:700;margin-bottom:6px;}
.sub{font-size:14px;color:var(--muted);margin-bottom:28px;}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
.alert.err{background:#ff4d4d12;border:1px solid #ff4d4d40;color:var(--red);}
.alert.ok{background:#00d08412;border:1px solid #00d08440;color:var(--green);}
.form-group{margin-bottom:16px;}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 14px;font:inherit;font-size:14px;color:var(--text);outline:none;}
input:focus{border-color:var(--green);}
input::placeholder{color:var(--muted);}
button{width:100%;background:var(--green);color:#080c10;border:none;border-radius:8px;padding:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
.back{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--muted);text-decoration:none;}
</style></head>
<body>
<div class="box">
  <div class="icon">🔐</div>
  <h1>Reset Password</h1>
  <p class="sub">Naya password set garnus.</p>

  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert ok">{{ success }} <a href="/login" style="color:var(--green);font-weight:700;">Login →</a></div>{% endif %}

  {% if not success %}
  <form method="POST" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}"/>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" name="password" placeholder="min 8 characters" required minlength="8"/>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" name="confirm" placeholder="repeat password" required minlength="8"/>
    </div>
    <button type="submit">Set New Password</button>
  </form>
  {% endif %}

  <a class="back" href="/login">← Back to Login</a>
</div>
</body></html>
