<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>FloorIQ — Admin Login</title><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/><style>:root{--bg:#080c10;--surface:#0d1117;--card:#0f1923;--border:#1c2430;--purple:#a855f7;--text:#e2e8f0;--muted:#64748b;--red:#ff4d4d;}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}.box{width:100%;max-width:380px;padding:0 20px;}.icon{width:48px;height:48px;background:#a855f720;border:1.5px solid #a855f740;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:20px;}h1{font-size:24px;font-weight:600;letter-spacing:-.5px;margin-bottom:6px;}.sub{font-size:14px;color:var(--muted);margin-bottom:28px;}.error{background:#ff4d4d12;border:1px solid #ff4d4d40;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:none;}.error.show{display:block;}.form-group{margin-bottom:16px;}label{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}input[type=text],input[type=password]{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;}input:focus{border-color:var(--purple);}input::placeholder{color:var(--muted);}button{width:100%;background:var(--purple);color:#fff;border:none;border-radius:8px;padding:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-top:4px;}button:hover{opacity:.88;}.back{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--muted);text-decoration:none;}.back:hover{color:var(--text);}</style></head><body><div class="box"><div class="icon">👑</div><h1>Admin Login</h1><p class="sub">FloorIQ Nepal — Admin Panel</p><div class="error {% if request.query_params.get('error') %}show{% endif %}">Invalid username or password.</div><form method="POST" action="/admin/panel/login"><div class="form-group"><label for="username">Username</label><input type="text" id="username" name="username" placeholder="admin username" required autocomplete="username"/></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password"/></div><button type="submit">Sign In to Admin Panel</button></form><a class="back" href="/login">← Back to broker login</a></div></body></html>
