<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FloorIQ Nepal — Broker Login</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#f6f7f9; color:#111; }
    header { padding: 18px 20px; background:#fff; border-bottom:1px solid #e6e8eb; }
    header h1 { margin:0; font-size:18px; }
    main { max-width: 520px; margin: 0 auto; padding: 18px 20px 40px; }
    .card { background:#fff; border:1px solid #e6e8eb; border-radius:10px; padding:16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    label { font-size:12px; color:#555; display:block; margin:12px 0 6px; }
    input { width:100%; padding:10px 10px; border:1px solid #d6d9dd; border-radius:8px; background:#fff; font: inherit; }
    button { margin-top:14px; width:100%; padding:10px 12px; border:1px solid #d6d9dd; border-radius:8px; background:#111; color:#fff; cursor:pointer; font: inherit; }
    .muted { color:#666; font-size:12px; margin-top:10px; }
    .error { color:#b00020; font-size:13px; white-space: pre-wrap; margin-top:10px; }
    .banner { margin-top:10px; padding:10px 12px; border-radius:10px; border:1px solid #e6e8eb; background:#fff7e6; font-size:13px; color:#333; }
  </style>
</head>
<body>
  <header>
    <h1>FloorIQ Nepal — Broker Login</h1>
    <div class="banner">{{ sebon_disclaimer }}</div>
  </header>

  <main>
    <section class="card">
      <div>
        <input type="hidden" id="next" value="{{ next }}" />

        <label for="broker_id">Broker ID</label>
        <input id="broker_id" inputmode="numeric" placeholder="e.g., 58" />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="password" />

        <div id="err" class="error" style="display:none;"></div>

        <button id="loginBtn" type="button">Login</button>
      </div>

      <div class="muted">
        Note: If you don’t have credentials, ask the admin to create/activate your broker account (Phase 1: env/Redis based).
      </div>

      <script>
        (function () {
          function showErr(msg) {
            var el = document.getElementById("err");
            if (!el) return;
            if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
            el.style.display = "block";
            el.textContent = msg;
          }

          async function doLogin() {
            showErr("");
            var bid = (document.getElementById("broker_id") || {}).value || "";
            var pwd = (document.getElementById("password") || {}).value || "";
            var next = (document.getElementById("next") || {}).value || "/dashboard";

            try {
              var res = await fetch("/login", {
                method: "POST",
                headers: { "content-type": "application/json", "accept": "application/json" },
                body: JSON.stringify({ broker_id: bid, password: pwd, next: next })
              });
              var data = null;
              try { data = await res.json(); } catch (e) { data = null; }

              if (!res.ok || !data || data.ok !== true) {
                showErr((data && data.error) ? data.error : ("HTTP " + res.status));
                return;
              }

              window.location.href = data.next || next || "/dashboard";
            } catch (e) {
              showErr(String(e && e.message ? e.message : e));
            }
          }

          var btn = document.getElementById("loginBtn");
          if (btn) btn.addEventListener("click", doLogin);

          ["broker_id", "password"].forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.addEventListener("keydown", function (e) {
              if (e.key === "Enter") doLogin();
            });
          });
        })();
      </script>
    </section>
  </main>
</body>
</html>
