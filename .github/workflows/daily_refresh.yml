name: daily-refresh

on:
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip NEPSE fetch and use existing data/raw/floorsheet_latest.csv"
        required: false
        default: false
        type: boolean
  schedule:
    # Nepal Time is UTC+5:45.
    # Run at 10:45 UTC ~= 16:30 NPT (4:30 PM Nepal time)
    - cron: "45 10 * * *"

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ML dependency
        run: |
          python - <<'PY2'
          import sklearn
          print("scikit-learn", sklearn.__version__)
          PY2

      - name: Fetch floorsheet to CSV (retry + validate)
        if: ${{ !inputs.skip_fetch }}
        id: fetch
        run: |
          mkdir -p data/raw
          set -e

          validate_csv() {
            python -c 'import pandas as pd, sys; path="data/raw/floorsheet_latest.csv"; df=pd.read_csv(path, usecols=["contractId","businessDate","tradeTime"]); row_count=len(df); business_dates=pd.to_datetime(df["businessDate"], errors="coerce").dt.date; unique_dates=int(business_dates.nunique(dropna=True)); trade_times=pd.to_datetime(df["tradeTime"], errors="coerce", utc=True); min_trade_time=trade_times.min(); max_trade_time=trade_times.max(); span_minutes=None if pd.isna(min_trade_time) or pd.isna(max_trade_time) else (max_trade_time - min_trade_time).total_seconds() / 60.0; print(f"[INFO] csv_row_count={row_count}"); print(f"[INFO] csv_unique_business_dates={unique_dates}"); print(f"[INFO] csv_min_trade_time={min_trade_time}"); print(f"[INFO] csv_max_trade_time={max_trade_time}"); print(f"[INFO] csv_trade_span_minutes={span_minutes}"); (unique_dates == 1 and row_count > 0 and not (row_count < 10000 and (span_minutes is None or span_minutes < 180))) or sys.exit(1)'
          }

          # Retry because NEPSE endpoint sometimes returns unexpected payloads
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            if python - <<'PY'
          import csv
          from nepse.NepseLib import Nepse

          fieldnames = [
              "contractId",
              "stockSymbol",
              "buyerMemberId",
              "sellerMemberId",
              "contractQuantity",
              "contractRate",
              "contractAmount",
              "businessDate",
              "tradeBookId",
              "stockId",
              "buyerBrokerName",
              "sellerBrokerName",
              "tradeTime",
              "securityName",
          ]

          nepse = Nepse()
          nepse.setTLSVerification(False)

          size = getattr(nepse, "floor_sheet_size", 500)
          base_url = nepse.api_end_points.get("floor_sheet")
          url = f"{base_url}?&size={size}&sort=contractId,desc"

          rows = []
          try:
              sheet = nepse.requestPOSTAPI(url, nepse.getPOSTPayloadIDForFloorSheet)

              if isinstance(sheet, list):
                  rows = sheet
              elif sheet:
                  floor_sheets = sheet.get("floorsheets", {}).get("content", [])
                  total_pages = sheet.get("floorsheets", {}).get("totalPages", 1)

                  for page_number in range(1, total_pages):
                      current_sheet = nepse.requestPOSTAPI(
                          f"{url}&page={page_number}",
                          nepse.getPOSTPayloadIDForFloorSheet,
                      )
                      if isinstance(current_sheet, list):
                          current_content = current_sheet
                      elif current_sheet:
                          current_content = current_sheet.get("floorsheets", {}).get("content", [])
                      else:
                          current_content = []
                      floor_sheets.extend(current_content)

                  rows = floor_sheets
          except Exception as e:
              import sys, traceback
              print("Error while fetching floorsheet:", e, file=sys.stderr)
              traceback.print_exc()
              sys.exit(1)

          with open("data/raw/floorsheet_latest.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames)
              writer.writeheader()
              for row in rows:
                  writer.writerow({key: row.get(key) for key in fieldnames})
          PY
            then
              # Validate header + non-empty file + basic truncation guard
              if [ -s data/raw/floorsheet_latest.csv ] \
                && head -n 1 data/raw/floorsheet_latest.csv | grep -q "contractId" \
                && validate_csv; then
                echo "Floorsheet CSV looks valid."
                break
              fi
            fi
            echo "Fetch failed or invalid CSV. Sleeping before retry..."
            sleep 20
          done

          # If still invalid, skip workflow gracefully (non-trading day / API issue)
          if [ ! -s data/raw/floorsheet_latest.csv ] \
            || ! head -n 1 data/raw/floorsheet_latest.csv | grep -q "contractId" \
            || ! validate_csv; then
            echo "WARNING: Could not fetch valid floorsheet CSV today."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Compress fetched floorsheet fallback
        if: ${{ !inputs.skip_fetch && steps.fetch.outputs.skip != 'true' }}
        run: |
          gzip -c data/raw/floorsheet_latest.csv > data/raw/floorsheet_latest.csv.gz
          ls -lh data/raw/floorsheet_latest.csv data/raw/floorsheet_latest.csv.gz

      - name: Upload floorsheet fallback artifact
        if: ${{ !inputs.skip_fetch && steps.fetch.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: floorsheet-latest-csv
          path: data/raw/floorsheet_latest.csv.gz
          if-no-files-found: error
          retention-days: 7

      - name: Restore floorsheet fallback artifact
        id: restore_fallback
        if: ${{ inputs.skip_fetch || steps.fetch.outputs.skip == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/raw /tmp/flooriq-fallback

          RUN_ID=""
          for CANDIDATE_RUN_ID in $(gh run list --workflow daily_refresh.yml --branch main --limit 20 --json databaseId,conclusion | python -c 'import json,sys; runs=json.load(sys.stdin); print(" ".join(str(r["databaseId"]) for r in runs if r["conclusion"]=="success"))'); do
            rm -rf /tmp/flooriq-fallback/*
            if gh run download "$CANDIDATE_RUN_ID" -n floorsheet-latest-csv -D /tmp/flooriq-fallback >/dev/null 2>&1; then
              RUN_ID="$CANDIDATE_RUN_ID"
              break
            fi
          done

          if [ -z "$RUN_ID" ]; then
            echo "[ERROR] No successful daily-refresh run with floorsheet fallback artifact was found."
            exit 1
          fi

          echo "[INFO] Downloading fallback artifact from run $RUN_ID"

          gzip -dc /tmp/flooriq-fallback/floorsheet_latest.csv.gz > data/raw/floorsheet_latest.csv

          if [ ! -s data/raw/floorsheet_latest.csv ]; then
            echo "[ERROR] Restored fallback CSV is missing or empty."
            exit 1
          fi

          if ! head -n 1 data/raw/floorsheet_latest.csv | grep -q "contractId"; then
            echo "[ERROR] Restored fallback CSV header invalid."
            exit 1
          fi

          ls -lh data/raw/floorsheet_latest.csv /tmp/flooriq-fallback/floorsheet_latest.csv.gz

      - name: Refresh pipeline (ingest + features + anomalies)
        if: ${{ steps.fetch.outputs.skip != 'true' || steps.restore_fallback.outcome == 'success' }}
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: "postgres"
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_SSLMODE: "require"
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TZ: "Asia/Kathmandu"
          WHATSAPP_PROVIDER: "dryrun"
        run: |
          PYTHONPATH=. python scripts/refresh.py --skip-fetch

      - name: WhatsApp daily alerts (dryrun)
        if: ${{ steps.fetch.outputs.skip != 'true' || steps.restore_fallback.outcome == 'success' }}
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: "postgres"
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_SSLMODE: "require"
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TZ: "Asia/Kathmandu"
          WHATSAPP_PROVIDER: "dryrun"
        run: |
          PYTHONPATH=. python scripts/whatsapp_daily.py
