name: daily-refresh

on:
  workflow_dispatch:
  schedule:
    # Nepal Time is UTC+5:45.
    # Run at 10:45 UTC ~= 16:30 NPT (4:30 PM Nepal time)
    - cron: "45 10 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ML dependency
        run: |
          python - <<'PY2'
          import sklearn
          print("scikit-learn", sklearn.__version__)
          PY2

      - name: Fetch floorsheet to CSV (retry + validate)
        id: fetch
        run: |
          mkdir -p data/raw
          set -e

          # Retry because NEPSE endpoint sometimes returns unexpected payloads
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            if nepse-cli --get-floorsheet --to-csv --output-file data/raw/floorsheet_latest.csv; then
              # Validate header + non-empty file
              if [ -s data/raw/floorsheet_latest.csv ] && head -n 1 data/raw/floorsheet_latest.csv | grep -q "contractId"; then
                echo "Floorsheet CSV looks valid."
                break
              fi
            fi
            echo "Fetch failed or invalid CSV. Sleeping before retry..."
            sleep 20
          done

          # If still invalid, skip workflow gracefully (non-trading day / API issue)
          if [ ! -s data/raw/floorsheet_latest.csv ] || ! head -n 1 data/raw/floorsheet_latest.csv | grep -q "contractId"; then
            echo "WARNING: Could not fetch valid floorsheet CSV today."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Refresh pipeline (ingest + features + anomalies)
        if: steps.fetch.outputs.skip != 'true'
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: "postgres"
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_SSLMODE: "require"
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TZ: "Asia/Kathmandu"
          WHATSAPP_PROVIDER: "dryrun"
        run: |
          PYTHONPATH=. python scripts/refresh.py --skip-fetch

      - name: WhatsApp daily alerts (dryrun)
        if: steps.fetch.outputs.skip != 'true'
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: "postgres"
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_SSLMODE: "require"
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TZ: "Asia/Kathmandu"
          WHATSAPP_PROVIDER: "dryrun"
        run: |
          PYTHONPATH=. python scripts/whatsapp_daily.py
